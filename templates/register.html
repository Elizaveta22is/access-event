{% extends "base.html" %}
{% block title %}Регистрация — AccessEvent{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form id="reg-form" aria-labelledby="reg-heading">
    <h2 id="reg-heading" class="visually-hidden">Форма регистрации</h2>
    <label for="f-name">Имя пользователя</label>
    <input id="f-name" type="text" name="username" required>
    <label for="f-email">Email</label>
    <input id="f-email" type="email" name="email" required>
    <label for="f-pass">Пароль (не менее 8 символов)</label>
    <input id="f-pass" type="password" name="password" minlength="8" required>
    <label for="f-role">Я регистрируюсь как</label>
    <select id="f-role" name="role">
        <option value="user">Участник</option>
        <option value="organizer">Организатор</option>
    </select>
    <button type="submit">Зарегистрироваться</button>
</form>
<div id="reg-msg" role="status" aria-live="polite"></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/register.js') }}"></script>{% endblock %}
