{% extends "base.html" %}
{% block title %}Регистрация — AccessEvent{% endblock %}
{% block content %}
<div class="form-container">
  <h1>Регистрация</h1>
  {% if error %}<div class="notification notification-error" role="alert">{{ error }}</div>{% endif %}
  <form id="register-form" method="POST" action="{{ url_for('register_page') }}" aria-label="Форма регистрации">
    <div class="form-group"><label for="username">Имя:</label><input type="text" id="username" name="username" required></div>
    <div class="form-group"><label for="email">Email:</label><input type="email" id="email" name="email" required></div>
    <div class="form-group"><label for="password">Пароль:</label><input type="password" id="password" name="password" minlength="8" required></div>
    <div class="form-group"><label for="role">Роль:</label>
      <select id="role" name="role"><option value="user">Участник</option><option value="organizer">Организатор</option></select>
    </div>
    <div class="form-group checkbox-group">
      <input type="checkbox" id="is_deaf" name="is_deaf" value="true">
      <label for="is_deaf">Я глухой или слабослышащий</label>
    </div>
    <div class="form-group"><label for="accessibility_needs">Особые потребности:</label>
      <textarea id="accessibility_needs" name="accessibility_needs" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
  </form>
</div>
{% endblock %}
