{% extends "base.html" %}
{% block title %}Вход — AccessEvent{% endblock %}
{% block content %}
<div class="form-container">
  <h1>Вход</h1>
  {% if error %}<div class="notification notification-error" role="alert">{{ error }}</div>{% endif %}
  <form id="login-form" method="POST" action="{{ url_for('login_page') }}" aria-label="Форма входа">
    <div class="form-group"><label for="email">Email:</label><input type="email" id="email" name="email" required></div>
    <div class="form-group"><label for="password">Пароль:</label><input type="password" id="password" name="password" required></div>
    <button type="submit" class="btn btn-primary">Войти</button>
  </form>
  <p>Нет аккаунта? <a href="{{ url_for('register_page') }}">Зарегистрируйтесь</a></p>
</div>
{% endblock %}
