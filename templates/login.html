{% extends "base.html" %}
{% block title %}Вход — AccessEvent{% endblock %}
{% block content %}
<h1>Вход</h1>
<form id="login-form" aria-labelledby="login-heading">
    <h2 id="login-heading" class="visually-hidden">Форма входа</h2>
    <label for="l-email">Email</label>
    <input id="l-email" type="email" name="email" required>
    <label for="l-pass">Пароль</label>
    <input id="l-pass" type="password" name="password" required>
    <button type="submit">Войти</button>
</form>
<div id="login-msg" role="status" aria-live="polite"></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/login.js') }}"></script>{% endblock %}
