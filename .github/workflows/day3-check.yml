name: Day3 Backend Check
on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check project structure
        run: |
          test -f app.py
          test -f config.py
          test -f models.py
          test -f routes/auth.py
          test -f routes/events.py
          test -f routes/registrations.py
          test -f utils/auth_helpers.py
      - name: Check security helpers
        run: |
          grep -q "hash_password" utils/auth_helpers.py && echo "PASS: hash_password" || echo "FAIL: hash_password"
          grep -q "generate_token" utils/auth_helpers.py && echo "PASS: jwt" || echo "FAIL: jwt"
          grep -q "role_required" utils/auth_helpers.py && echo "PASS: roles" || echo "FAIL: roles"
      - name: Check accessibility
        run: grep -q "accessibility" utils/accessibility.py && echo "PASS: accessibility" || echo "FAIL: accessibility"
      - name: Syntax check
        run: python -m py_compile app.py config.py models.py routes/*.py utils/*.py
      - run: echo "PASS: Day3 Backend Check completed"
